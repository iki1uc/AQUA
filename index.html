<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AQUA Cycle</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}
iframe {
    width: 100vw;
    height: 100vh;
    border: none;
}
</style>

</head>
<body>

<iframe id="aquaFrame" src="i.html"></iframe>

<script>
const pages = ["i.html", "o.html", "u.html"];
let index = 0;

setInterval(() => {
    index = (index + 1) % pages.length;
    document.getElementById("aquaFrame").src = pages[index];
}, 1000); // 1000ms = 1 Sekunde
</script>

</body>
</html>
